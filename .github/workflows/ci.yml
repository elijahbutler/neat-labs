name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun run check

  image:
    # Builds the image Coolify deploys and checks it serves in production mode, with a writable /app/data volume.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t site .
      - run: |
          mkdir -p data && chmod 777 data
          docker run -d --name site -p 3000:3000 -v "$PWD/data:/app/data" -e PUBLIC_URL=http://localhost:3000 site
          for i in $(seq 1 30); do curl -fs localhost:3000/api/health && break; sleep 1; done
          for path in / /components /components/hero-split /styles/paper /connect "/specimen/hero-split?style=paper" /catalogue.json; do
            curl -fs -o /dev/null "localhost:3000$path" || { echo "failed: $path"; docker logs site; exit 1; }
          done
          curl -fs -X POST localhost:3000/api/waitlist -H 'content-type: application/json' -d '{"email":"ci@example.com"}'
          grep -q ci@example.com data/waitlist.jsonl
          curl -fs -X POST localhost:3000/api/mcp -H 'content-type: application/json' -H 'accept: application/json, text/event-stream' \
            -d '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"ci","version":"1"}}}' | grep -q neat-labs
